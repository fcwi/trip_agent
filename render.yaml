services:
  - type: web
    name: trip-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GAS_URL
        sync: false
      - key: GAS_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPTILER_PUBLIC_KEY
        sync: false
