name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trip:
          - 2026_busan
          - 2026_karuizawa
    env:
      VITE_TRIP_ID: ${{ matrix.trip }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build trip
        run: npm run build
      - name: Verify build output
        run: npm run build:verify

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trip:
          - 2026_busan
          - 2026_karuizawa
    env:
      E2E_TRIP_ID: ${{ matrix.trip }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.trip }}
          path: playwright-report/
          retention-days: 7
